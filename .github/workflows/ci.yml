name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check cardiofilter tests
      - name: Test with coverage (>= 80% enforced in pyproject)
        run: pytest
      - name: Smoke-test the experiment pipeline on synthetic records
        run: cardiofilter experiment --synthetic 2 --noise white hum --snr 0 10 --methods none bandpass wavelet --out /tmp/results
